name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: No private data tracked
        run: |
          if git ls-files | grep -Ei '\.(csv|pdf|bib|ris|docx|xlsx|jsonl)$|(^|/)ei\.config\.json$|settings\.local\.json$'; then
            echo "Private data files are tracked. Remove them from git."; exit 1
          fi
      - name: Byte-compile scripts
        run: python -m py_compile scripts/*.py scripts/hooks/*.py
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Validate wiki (front matter, links)
        run: python scripts/eidb.py validate --wiki-only
